[package]
name = "patter"
version = "0.6.5"
description = "Your personal meeting notebook"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
whisper-rs = { version = "0.15", features = ["metal"] }
hound = "3.5"
sha2 = "0.10"
fs2 = "0.4"
base64 = "0.22"
flate2 = "1"
security-framework = "3"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
libc = "0.2"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKTypes", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKParticipant"] }
objc2-user-notifications = { version = "0.3", features = ["block2"] }
block2 = "0.6"

[dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process"] }
minisign-verify = "0.2"
