name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a tag on main and refuse replacing published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/patter-release-state; then
            test "$(cat /tmp/patter-release-state)" = true
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure optional bootstrap test feed
        env:
          TEST_FEED: ${{ vars.PATTER_TEST_FEED }}
        run: |
          node -e 'const fs=require("fs");const c=process.env.TEST_FEED?{plugins:{updater:{endpoints:[process.env.TEST_FEED]}}}:{};fs.writeFileSync("/tmp/patter-release-config.json",JSON.stringify(c));'
      - name: Build DMG and signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_OSX_DEPLOYMENT_TARGET: '15.0'
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: pnpm tauri build --ci --config /tmp/patter-release-config.json
      - name: Inspect bundle
        run: |
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Patter.app
          file src-tauri/target/release/bundle/macos/Patter.app/Contents/MacOS/patter
          otool -L src-tauri/target/release/bundle/macos/Patter.app/Contents/MacOS/patter
          otool -L src-tauri/target/release/bundle/macos/Patter.app/Contents/Resources/resources/patter-native
          node scripts/artifacts.mjs
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-update
      - name: Upload complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Patter $GITHUB_REF_NAME" --notes-file release-artifacts/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.dmg release-artifacts/*.tar.gz release-artifacts/*.sig release-artifacts/latest.json release-artifacts/SHA256SUMS --clobber
      - name: Publish validated release
        if: vars.PATTER_AUTO_PUBLISH == 'true' && vars.PATTER_TEST_FEED == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
